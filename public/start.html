    const bareMuxConnection = new BareMux.BareMuxConnection("/baremux/worker.js");

    async function setupProxy() {
        await bareMuxConnection.setTransport("/epoxy/index.mjs", [{
            wisp: `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/wisp/`
        }]);

        const registration = await navigator.serviceWorker.register("/uv/sw.js", {
            scope: "/"
        });

        await navigator.serviceWorker.ready;
        console.log("Proxy ready");
    }

    setupProxy().catch(console.error);

    <script>
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 0;

        const frameContainer =
            document.getElementById("frame-container");

        const tabBar =
            document.getElementById("tab-bar");

        function createTab(url = "/") {

            const id = ++tabCounter;

            const tab = {
                id,
                title: "New Tab",
                url
            };

            tabs.push(tab);

            const frame = document.createElement("iframe");

            frame.className = "browser-frame";
            frame.id = `frame-${id}`;

            frame.src = url;

            frame.onload = () => {
                try {
                    const frameDocument =
                        frame.contentDocument;

                    if (frameDocument &&
                        frameDocument.title) {

                        tab.title =
                            frameDocument.title;

                        updateTabTitle(id);
                    }
                } catch {}
            };

            frameContainer.appendChild(frame);

            activeTabId = id;

            renderTabs();
            switchTab(id);
        }


        function switchTab(id) {

            activeTabId = id;

            document
                .querySelectorAll(".browser-frame")
                .forEach(frame => {

                    frame.classList.toggle(
                        "active",
                        frame.id === `frame-${id}`
                    );
                });

            document
                .querySelectorAll(".browser-tab")
                .forEach(tab => {

                    tab.classList.toggle(
                        "active",
                        Number(tab.dataset.id) === id
                    );
                });

            updateAddressBar();
        }


        function closeTab(id) {

            const index =
                tabs.findIndex(tab => tab.id === id);

            if (index === -1) return;

            const frame =
                document.getElementById(`frame-${id}`);

            if (frame) {
                frame.remove();
            }

            tabs.splice(index, 1);

            if (tabs.length === 0) {
                createTab();
                return;
            }

            if (activeTabId === id) {

                const newIndex =
                    Math.max(0, index - 1);

                switchTab(
                    tabs[newIndex].id
                );
            }

            renderTabs();
        }


        function renderTabs() {

            document
                .querySelectorAll(".browser-tab")
                .forEach(tab => tab.remove());

            const newTabButton =
                document.getElementById("new-tab");

            tabs.forEach(tab => {

                const element =
                    document.createElement("div");

                element.className =
                    "browser-tab";

                element.dataset.id =
                    tab.id;

                if (tab.id === activeTabId) {
                    element.classList.add("active");
                }

                const favicon =
                    document.createElement("span");

                favicon.className =
                    "browser-tab-favicon";

                const title =
                    document.createElement("span");

                title.className =
                    "browser-tab-title";

                title.textContent =
                    tab.title;

                const close =
                    document.createElement("button");

                close.className =
                    "browser-tab-close";

                close.textContent = "×";

                close.onclick = event => {
                    event.stopPropagation();
                    closeTab(tab.id);
                };

                element.appendChild(favicon);
                element.appendChild(title);
                element.appendChild(close);

                element.onclick = () => {
                    switchTab(tab.id);
                };

                tabBar.insertBefore(
                    element,
                    newTabButton
                );
            });
        }


        function updateTabTitle(id) {

            const tab =
                tabs.find(tab => tab.id === id);

            if (!tab) return;

            const element =
                document.querySelector(
                    `.browser-tab[data-id="${id}"]`
                );

            if (!element) return;

            const title =
                element.querySelector(
                    ".browser-tab-title"
                );

            title.textContent =
                tab.title;
        }


        function getCurrentFrame() {

            if (activeTabId === null) {
                return null;
            }

            return document.getElementById(
                `frame-${activeTabId}`
            );
        }


        function getCurrentTab() {

            return tabs.find(
                tab => tab.id === activeTabId
            );
        }


        function updateAddressBar() {

            const tab =
                getCurrentTab();

            if (!tab) return;

            const input =
                document.getElementById(
                    "uv-address"
                );

            if (tab.url !== "/") {
                input.value = tab.url;
            } else {
                input.value = "";
            }
        }


        function openCurrentTab() {

            const frame =
                getCurrentFrame();

            if (!frame) return;

            window.open(
                frame.src,
                "_blank"
            );
        }


        // Start with one tab
        createTab();
    </script>


    <!-- SEARCH -->

    <script>
        document
            .getElementById('uv-form')
            .addEventListener('submit', function(event) {

                event.preventDefault();

                const urlInput =
                    document.getElementById('uv-address');

                let input =
                    urlInput.value.trim();

                if (!input) return;

                let url;

                if (
                    input.startsWith('http://') ||
                    input.startsWith('https://') ||
                    (
                        input.includes('.') &&
                        !input.includes(' ')
                    )
                ) {

                    url =
                        input.startsWith('http')
                            ? input
                            : 'https://' + input;

                } else {

                    url =
                        'https://www.google.com/search?q=' +
                        encodeURIComponent(input);
                }

                let tab =
                    getCurrentTab();

                if (!tab) {
                    createTab();
                    tab = getCurrentTab();
                }

                const iframe =
                    getCurrentFrame();

                const proxied =
                    __uv$config.prefix +
                    __uv$config.encodeUrl(url);

                iframe.src = proxied;

                tab.url = url;
                tab.title = input;

                urlInput.value =
                    'Loading..';

                updateTabTitle(tab.id);

                iframe.onload = function() {

                    try {

                        const title =
                            iframe.contentDocument?.title;

                        if (title) {
                            tab.title = title;
                            updateTabTitle(tab.id);
                        }

                    } catch {}

                    urlInput.value = url;
                };
            });
    </script>


    <!-- BOOKMARKS -->

    <script>

        const bookmarkList =
            document.getElementById(
                'bookmark-list'
            );

        const addBookmarkButton =
            document.getElementById(
                'add-bookmark'
            );

        const bookmarkNameInput =
            document.getElementById(
                'bookmark-name'
            );


        function loadBookmarks() {

            const bookmarks =
                JSON.parse(
                    localStorage.getItem(
                        'bookmarks'
                    )
                ) || [];

            bookmarks.forEach(bookmark => {

                addBookmarkToList(
                    bookmark.name,
                    bookmark.url
                );
            });
        }


        function addBookmarkToList(name, url) {

            const listItem =
                document.createElement('li');

            listItem.textContent =
                name;

            const removeButton =
                document.createElement('button');

            removeButton.textContent =
                '×';

            removeButton.onclick =
                event => {

                    event.stopPropagation();

                    removeBookmark(
                        name,
                        url
                    );

                    listItem.remove();
                };

            listItem.appendChild(
                removeButton
            );

            listItem.onclick = () => {

                document.getElementById(
                    'uv-address'
                ).value = url;

                document
                    .getElementById('uv-form')
                    .dispatchEvent(
                        new Event('submit')
                    );
            };

            bookmarkList.appendChild(
                listItem
            );
        }


        function removeBookmark(name, url) {

            const bookmarks =
                JSON.parse(
                    localStorage.getItem(
                        'bookmarks'
                    )
                ) || [];

            const updatedBookmarks =
                bookmarks.filter(
                    bookmark =>
                        !(
                            bookmark.name === name &&
                            bookmark.url === url
                        )
                );

            localStorage.setItem(
                'bookmarks',
                JSON.stringify(updatedBookmarks)
            );
        }


        addBookmarkButton.addEventListener(
            'click',
            () => {

                const name =
                    bookmarkNameInput.value.trim();

                const url =
                    document.getElementById(
                        'uv-address'
                    ).value.trim();

                if (name && url) {

                    const bookmarks =
                        JSON.parse(
                            localStorage.getItem(
                                'bookmarks'
                            )
                        ) || [];

                    bookmarks.push({
                        name,
                        url
                    });

                    localStorage.setItem(
                        'bookmarks',
                        JSON.stringify(bookmarks)
                    );

                    addBookmarkToList(
                        name,
                        url
                    );

                    bookmarkNameInput.value = '';

                } else {

                    alert(
                        'Please enter a name and ensure the URL is set.'
                    );
                }
            }
        );


        loadBookmarks();

    </script>


    <!-- SEARCH HISTORY / SUGGESTIONS -->

    <script>

        (function () {

            const POPULAR_SEARCHES = [
                'youtube',
                'google',
                'discord',
                'netflix',
                'spotify',
                'reddit',
                'twitch',
                'tiktok',
                'instagram',
                'chatgpt',
                'roblox',
                'wikipedia',
                'amazon',
                'gmail',
                'twitter',
                'google maps',
                'weather',
                'translate',
                'news',
                'unblocked games',
                'steam'
            ];

            const HISTORY_KEY =
                'isola_recent_searches';

            const MAX_SUGGESTIONS = 6;


            function getHistory() {

                try {

                    return JSON.parse(
                        localStorage.getItem(
                            HISTORY_KEY
                        )
                    ) || [];

                } catch {

                    return [];
                }
            }


            function saveToHistory(term) {

                const history =
                    getHistory().filter(
                        item =>
                            item.toLowerCase() !==
                            term.toLowerCase()
                    );

                history.unshift(term);

                localStorage.setItem(
                    HISTORY_KEY,
                    JSON.stringify(
                        history.slice(0, 20)
                    )
                );
            }


            function buildSuggestions(query) {

                const q =
                    query.toLowerCase();

                const history =
                    getHistory();


                const historyMatches =
                    history
                        .filter(
                            item =>
                                item
                                    .toLowerCase()
                                    .includes(q)
                        )
                        .map(
                            item => ({
                                phrase: item,
                                type: 'recent'
                            })
                        );


                const popularMatches =
                    POPULAR_SEARCHES
                        .filter(
                            item =>
                                item
                                    .toLowerCase()
                                    .includes(q)
                        )
                        .filter(
                            item =>
                                !historyMatches.some(
                                    h =>
                                        h.phrase
                                            .toLowerCase() ===
                                        item.toLowerCase()
                                )
                        )
                        .map(
                            item => ({
                                phrase: item,
                                type: 'popular'
                            })
                        );


                return [
                    ...historyMatches,
                    ...popularMatches
                ].slice(
                    0,
                    MAX_SUGGESTIONS
                );
            }


            document.addEventListener(
                'DOMContentLoaded',
                () => {

                    const searchBox =
                        document.getElementById(
                            'uv-address'
                        );

                    const suggestionsBox =
                        document.getElementById(
                            'suggestions-box'
                        );

                    let activeIndex = -1;


                    function render(
                        suggestions
                    ) {

                        suggestionsBox.innerHTML = '';

                        activeIndex = -1;


                        if (
                            suggestions.length === 0
                        ) {

                            suggestionsBox.style.display =
                                'none';

                            return;
                        }


                        suggestions.forEach(
                            suggestion => {

                                const item =
                                    document.createElement(
                                        'div'
                                    );

                                item.classList.add(
                                    'suggestion-item'
                                );


                                const icon =
                                    document.createElement(
                                        'span'
                                    );

                                icon.classList.add(
                                    'suggestion-icon'
                                );

                                icon.textContent =
                                    suggestion.type === 'recent'
                                        ? '⟲'
                                        : '↗';


                                const label =
                                    document.createElement(
                                        'span'
                                    );

                                label.textContent =
                                    suggestion.phrase;


                                item.appendChild(icon);
                                item.appendChild(label);


                                item.addEventListener(
                                    'mousedown',
                                    event => {

                                        event.preventDefault();

                                        searchBox.value =
                                            suggestion.phrase;

                                        suggestionsBox.style.display =
                                            'none';

                                        document
                                            .getElementById(
                                                'uv-form'
                                            )
                                            .dispatchEvent(
                                                new Event(
                                                    'submit'
                                                )
                                            );
                                    }
                                );


                                suggestionsBox.appendChild(
                                    item
                                );
                            }
                        );


                        suggestionsBox.style.display =
                            'block';
                    }


                    searchBox.addEventListener(
                        'input',
                        () => {

                            const query =
                                searchBox.value.trim();

                            render(
                                buildSuggestions(
                                    query
                                )
                            );
                        }
                    );


                    searchBox.addEventListener(
                        'focus',
                        () => {

                            if (
                                searchBox.value
                                    .trim()
                                    .length === 0
                            ) {

                                render(
                                    getHistory()
                                        .slice(
                                            0,
                                            MAX_SUGGESTIONS
                                        )
                                        .map(
                                            item => ({
                                                phrase: item,
                                                type: 'recent'
                                            })
                                        )
                                );
                            }
                        }
                    );


                    searchBox.addEventListener(
                        'keydown',
                        event => {

                            const items =
                                suggestionsBox.querySelectorAll(
                                    '.suggestion-item'
                                );

                            if (
                                !items.length ||
                                (
                                    event.key !==
                                    'ArrowDown' &&
                                    event.key !==
                                    'ArrowUp'
                                )
                            ) {
                                return;
                            }

                            event.preventDefault();

                            items.forEach(
                                item =>
                                    item.classList.remove(
                                        'active'
                                    )
                            );


                            activeIndex =
                                event.key === 'ArrowDown'
                                    ? (
                                        activeIndex + 1
                                    ) % items.length
                                    : (
                                        activeIndex -
                                        1 +
                                        items.length
                                    ) % items.length;


                            items[
                                activeIndex
                            ].classList.add(
                                'active'
                            );


                            searchBox.value =
                                items[
                                    activeIndex
                                ].textContent;
                        }
                    );


                    document.addEventListener(
                        'click',
                        event => {

                            if (
                                !suggestionsBox.contains(
                                    event.target
                                ) &&
                                event.target !==
                                    searchBox
                            ) {

                                suggestionsBox.style.display =
                                    'none';
                            }
                        }
                    );


                    document.addEventListener(
                        'submit',
                        event => {

                            if (
                                event.target &&
                                event.target.id ===
                                    'uv-form'
                            ) {

                                const term =
                                    searchBox.value.trim();

                                if (
                                    term &&
                                    term !==
                                        'Loading..'
                                ) {

                                    saveToHistory(
                                        term
                                    );
                                }

                                suggestionsBox.style.display =
                                    'none';
                            }

                        },
                        true
                    );

                }
            );

        })();

    </script>
